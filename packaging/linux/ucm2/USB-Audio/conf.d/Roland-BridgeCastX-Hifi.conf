# Roland BRIDGE CAST X (0582:02e8): 8 playback and 6 capture USB channels.
# Layout measured on FW 1.02 build 67: playback with the device level meters,
# capture with a test tone in each playback channel (1-2 STREAM, 3-4 MIC,
# 5-6 PERSONAL). Channels 5-6 follow the PERSONAL faders; 3-4 carry only the
# mic, after its noise gate.

Include.pcm_split.File "/common/pcm/split.conf"

Macro [
	{
		SplitPCM {
			Name "bcx_stereo_out"
			Direction Playback
			Channels 2
			HWChannels 8
			HWChannelPos0 FL
			HWChannelPos1 FR
			HWChannelPos2 FL
			HWChannelPos3 FR
			HWChannelPos4 FL
			HWChannelPos5 FR
			HWChannelPos6 FL
			HWChannelPos7 FR
		}
	}
	{
		SplitPCM {
			Name "bcx_stereo_in"
			Direction Capture
			Channels 2
			HWChannels 6
			HWChannelPos0 FL
			HWChannelPos1 FR
			HWChannelPos2 FL
			HWChannelPos3 FR
			HWChannelPos4 FL
			HWChannelPos5 FR
		}
	}
]

SectionDevice."Line1" {
	Comment "Chat"

	Value {
		PlaybackPriority 100
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "bcx_stereo_out"
		Direction Playback
		HWChannels 8
		Channels 2
		Channel0 0
		Channel1 1
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

SectionDevice."Line2" {
	Comment "Game"

	Value {
		PlaybackPriority 200
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "bcx_stereo_out"
		Direction Playback
		HWChannels 8
		Channels 2
		Channel0 2
		Channel1 3
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

SectionDevice."Line3" {
	Comment "Music"

	Value {
		PlaybackPriority 300
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "bcx_stereo_out"
		Direction Playback
		HWChannels 8
		Channels 2
		Channel0 6
		Channel1 7
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

SectionDevice."Line4" {
	Comment "System"

	Value {
		PlaybackPriority 400
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "bcx_stereo_out"
		Direction Playback
		HWChannels 8
		Channels 2
		Channel0 4
		Channel1 5
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

SectionDevice."Line5" {
	Comment "Stream"

	Value {
		CapturePriority 200
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "bcx_stereo_in"
		Direction Capture
		HWChannels 6
		Channels 2
		Channel0 0
		Channel1 1
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

SectionDevice."Line6" {
	Comment "Personal"

	Value {
		CapturePriority 100
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "bcx_stereo_in"
		Direction Capture
		HWChannels 6
		Channels 2
		Channel0 4
		Channel1 5
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

SectionDevice."Line7" {
	Comment "Mic"

	Value {
		CapturePriority 300
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "bcx_stereo_in"
		Direction Capture
		HWChannels 6
		Channels 2
		Channel0 2
		Channel1 3
		ChannelPos0 FL
		ChannelPos1 FR
	}
}
